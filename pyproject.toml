[project]
name = "commentlead"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.146.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "APScheduler==3.11.3",
    "PyJWT==2.15.1",
    "pydantic==2.14.1",
    "tzdata==2026.5",
    "psycopg[binary]==3.3.6",
]

[tool.uv]
package = false

# Vercel uses this manifest for dependencies and the API entry point.
[tool.vercel]
entrypoint = "backend.main:app"
